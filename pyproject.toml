[project]
name = "ecoloop-building-agents"
version = "0.1.0"
description = "Safety-governed autonomous supervisory control for EnergyPlus"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "streamlit>=1.30",
    "pydantic>=2.0",
    "mcp>=1.9",
    "requests>=2.31",
    "plotly>=6.9.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.0",
    "langgraph>=0.4",
    "langchain-openai>=0.4",
    "langchain-core>=0.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
ecoloop = "ecoloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoloop"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
